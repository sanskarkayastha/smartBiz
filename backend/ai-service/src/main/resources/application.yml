spring:
  application:
    name: AI-SERVICE
  config:
    import: optional:file:../.env[.properties]

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  sales-url: ${SALES_SERVICE_URL:http://localhost:8084}

logging:
  level:
    root: INFO
    com.smartbiz.ai: DEBUG
