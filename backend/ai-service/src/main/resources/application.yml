spring:
  application:
    name: AI-SERVICE
  datasource:
    url: ${SPRING_DATASOURCE_URL:${AI_DB_URL:jdbc:postgresql://localhost:5432/ai_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  sales-url: ${SALES_SERVICE_URL:http://localhost:8084}
  crm-url: ${CRM_SERVICE_URL:http://localhost:8083}

logging:
  level:
    root: INFO
    com.smartbiz.ai: DEBUG
