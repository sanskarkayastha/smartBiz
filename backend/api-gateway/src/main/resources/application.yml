spring:
  application:
    name: API-GATEWAY
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - X-User-Id
              - Content-Type
            exposedHeaders:
              - Authorization
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=0

        - id: crm-service
          uri: lb://CRM-SERVICE
          predicates:
            - Path=/customers/**
          filters:
            - StripPrefix=0

        - id: sales-service
          uri: lb://SALES-SERVICE
          predicates:
            - Path=/sales/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=0

        - id: messaging-service
          uri: lb://MESSAGING-SERVICE
          predicates:
            - Path=/messages/**
          filters:
            - StripPrefix=0

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: your-secret-key-change-in-production-at-least-32-characters-long

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
