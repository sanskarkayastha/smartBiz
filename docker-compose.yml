services:
  # ===== CACHE =====
  redis:
    image: redis:7-alpine
    container_name: smartbiz-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbiz-network

  # ===== SERVICE DISCOVERY =====
  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: smartbiz-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - smartbiz-network

  # ===== API GATEWAY =====
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: smartbiz-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${JWT_SECRET:-smartbiz-dev-secret-key-at-least-32-chars-long-min}
    depends_on:
      - eureka-server
    networks:
      - smartbiz-network

  # ===== MICROSERVICES =====
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: smartbiz-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${JWT_SECRET:-smartbiz-dev-secret-key-at-least-32-chars-long-min}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-false}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-no-reply@smartbiz.app}
      AUTH_EMAIL_DEV_LOG_OTP: ${AUTH_EMAIL_DEV_LOG_OTP:-true}
      AUTH_VERIFICATION_CODE_EXPIRY_MINUTES: ${AUTH_VERIFICATION_CODE_EXPIRY_MINUTES:-10}
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-smartbiz-internal-dev-token}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SALES_SERVICE_URL: http://sales-service:8084
      CRM_SERVICE_URL: http://crm-service:8083
      AI_SERVICE_URL: http://ai-service:8085
      BILLING_PUBLIC_BASE_URL: ${BILLING_PUBLIC_BASE_URL:-http://localhost:8080}
      BILLING_WEB_RETURN_URL: ${BILLING_WEB_RETURN_URL:-http://localhost:3000/dashboard/settings}
      BILLING_MOBILE_RETURN_URL: ${BILLING_MOBILE_RETURN_URL:-smartbiz://billing/result}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ESEWA_BILLING_ENABLED: ${ESEWA_BILLING_ENABLED:-true}
      ESEWA_SMARTBIZ_PRODUCT_CODE: ${ESEWA_SMARTBIZ_PRODUCT_CODE:-EPAYTEST}
      ESEWA_SMARTBIZ_SECRET_KEY: ${ESEWA_SMARTBIZ_SECRET_KEY:-8gBm/:&EnhH.1/q}
      ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      ESEWA_STATUS_URL: ${ESEWA_STATUS_URL:-https://uat.esewa.com.np/api/epay/transaction/status/}
      GOOGLE_ALLOWED_REDIRECT_PREFIXES: ${GOOGLE_ALLOWED_REDIRECT_PREFIXES:-http://localhost:3000/api/auth/google/callback,mobile://auth/callback}
    depends_on:
      - eureka-server
    networks:
      - smartbiz-network

  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory-service/Dockerfile
    container_name: smartbiz-inventory
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${INVENTORY_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${JWT_SECRET:-smartbiz-dev-secret-key-at-least-32-chars-long-min}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-smartbiz_product_images}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-smartbiz-internal-dev-token}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - smartbiz-network

  crm-service:
    build:
      context: ./backend
      dockerfile: crm-service/Dockerfile
    container_name: smartbiz-crm
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${CRM_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${JWT_SECRET:-smartbiz-dev-secret-key-at-least-32-chars-long-min}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-smartbiz-internal-dev-token}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - smartbiz-network

  sales-service:
    build:
      context: ./backend
      dockerfile: sales-service/Dockerfile
    container_name: smartbiz-sales
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SALES_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      APP_JWT_SECRET: ${JWT_SECRET:-smartbiz-dev-secret-key-at-least-32-chars-long-min}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-smartbiz-internal-dev-token}
      AUTH_SERVICE_URL: http://auth-service:8081
      PAYMENTS_PUBLIC_BASE_URL: ${PAYMENTS_PUBLIC_BASE_URL:-http://localhost:8080}
      ESEWA_ENVIRONMENT: ${ESEWA_ENVIRONMENT:-UAT}
      ESEWA_CREDENTIAL_ENCRYPTION_KEY: ${ESEWA_CREDENTIAL_ENCRYPTION_KEY:-smartbiz-dev-credential-key-change-me}
      ESEWA_INTENT_BOOK_URL: ${ESEWA_INTENT_BOOK_URL:-https://rc-checkout.esewa.com.np/api/client/intent/payment/book}
      ESEWA_INTENT_STATUS_URL: ${ESEWA_INTENT_STATUS_URL:-https://rc-checkout.esewa.com.np/api/client/intent/payment/status}
      ESEWA_INTENT_CANCEL_URL: ${ESEWA_INTENT_CANCEL_URL:-https://rc-checkout.esewa.com.np/api/client/intent/payment/cancel}
      ESEWA_UAT_PRODUCT_CODE: ${ESEWA_UAT_PRODUCT_CODE:-INTENT}
      ESEWA_UAT_ACCESS_KEY: ${ESEWA_UAT_ACCESS_KEY:-LB0REg8HUSw3MTYrI1s6JTE8Kyc6JyAqJiA3MQ==}
    depends_on:
      - eureka-server
    networks:
      - smartbiz-network

  # ===== AI SERVICE =====
  ai-service:
    build:
      context: ./backend
      dockerfile: ai-service/Dockerfile
    container_name: smartbiz-ai
    ports:
      - "8887:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${AI_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SALES_SERVICE_URL: http://sales-service:8084
      CRM_SERVICE_URL: http://crm-service:8083
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-smartbiz-internal-dev-token}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      - eureka-server
      - inventory-service
      - sales-service
      - crm-service
    networks:
      - smartbiz-network

  # ===== OPTIONAL SERVICES (Phase 2) =====
  #
  # messaging-service:
  #   build:
  #     context: ./backend
  #     dockerfile: messaging-service/Dockerfile
  #   ports:
  #     - "8086:8086"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: docker
  #     SPRING_DATASOURCE_URL: ${MESSAGING_DB_URL}
  #     SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  #     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  #     EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
  #   depends_on:
  #     - eureka-server
  #   networks:
  #     - smartbiz-network

networks:
  smartbiz-network:
    driver: bridge
